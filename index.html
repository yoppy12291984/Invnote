<script id="appearance-bootstrap">
// Resolve the background before stylesheets, body parsing or application downloads.
(()=>{
 const root=document.documentElement;
 let mode=null,last=null,prefs={};
 try{mode=localStorage.getItem('invnote-workspace-appearance');last=localStorage.getItem('invnote-workspace-resolved-theme');prefs=JSON.parse(localStorage.getItem('invnote-workspace-colors-v1')||'{}')||{};}catch{}
 const system=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
 const theme=['light','dark'].includes(mode)?mode:mode==='system'?system:['light','dark'].includes(last)?last:system;
 root.dataset.theme=theme;root.style.colorScheme=theme;
 const defaults=theme==='dark'?{bg:'#12171c',card:'#1b2229',text:'#e6eaee'}:{bg:'#f5f4ef',card:'#ffffff',text:'#243b35'};
 for(const [key,variable] of Object.entries({bg:'--bg',card:'--paper',text:'--ink'})){
  const value=prefs[theme]?.[key];root.style.setProperty(variable,/^#[0-9a-f]{6}$/i.test(value||'')?value:defaults[key]);
 }
 document.querySelector('meta[name=color-scheme]').setAttribute('content',theme);
 const meta=document.createElement('meta');meta.name='theme-color';meta.content=root.style.getPropertyValue('--bg');document.head.append(meta);
})();

<script id="app-release" type="application/json">{"version": "1.24", "date": "2026-10-05", "changes": ["ホーム画面アイコンを濃紺とゴールドの上昇グラフへ変更", "端末登録後の引き継ぎ状況・再試行と、取得失敗時の送信停止を追加"], "build": "8c16f3e27341"}</script><script id="data" type="application/json">{"notes": {}, "coverage": {"body_notes": 0, "registered": 0, "legacy_references": 0}, "ratings": {"rows": [], "assessment_date": "未同期", "price_date": "未同期", "horizons": {"3m": {"target_date": "未設定"}, "12m": {"target_date": "未設定"}}, "evaluation_rules": []}}</script><script>
'use strict';
let D=JSON.parse(document.getElementById('data').textContent), notes=D.notes, R=D.ratings, ratings=Object.fromEntries(R.rows.map(x=>[x.code,x]));
const app=document.getElementById('app'), status=document.getElementById('status'), KEY='private-investment-preview-watch-v1';
let watch=new Set(), query='', discoveryQuery='', newsQuery='', theme='', sort='updated', onlyWatch=false, priorView='notebook';
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))watch=new Set(saved.filter(c=>Object.hasOwn(notes,c)));}catch{status.textContent='監視リストを読み込めませんでした。この画面内で選択できます。';}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let all=Object.entries(notes), themes=[...new Set(all.flatMap(([,n])=>n.themes))].sort((a,b)=>a.localeCompare(b,'ja'));
const themeLabel=t=>String(t).replace(/めっき/g,'メッキ');
const score=c=>ratings[c]?`<div class="score">3か月 <b>${ratings[c].short_3m}</b> / 12か月 <b>${ratings[c].long_12m}</b></div>`:'<small>未採点</small>';
const title=(eye,h,p)=>`<div class="section-top"><div class="eyebrow">${eye}</div><h1>${h}</h1><p class="muted">${p}</p></div>`;
const card=(c,n,change=false)=>`<article class="card company-card"><small>${esc(c)} · 研究 ${esc(n.updated)}</small><div><button class="open" data-company="${c}">${esc(n.name)}</button></div>${score(c)}<p>${esc(change?n.change:n.summary)}</p><div>${n.themes.slice(0,3).map(t=>`<span class="pill">${esc(themeLabel(t))}</span>`).join('')}</div></article>`;
let demandMapId='ai';
function demandMap(){
 priorView='discover/map';
 const list=Array.isArray(D.demandMaps?.maps)?D.demandMaps.maps:[];
 app.innerHTML=title('DEMAND MAP','需要のつながり','川上の変化から、工程・企業・利益へ。');
 if(!list.length){app.innerHTML+='<p class="empty">需要マップを読み込むには、右上の同期を押してください。</p>';return;}
 const m=list.find(x=>x.id===demandMapId)||list[0];
 const icons={network:'<circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><path d="M10 8 6 16m8-8 4 8M8 19h8"/>',waves:'<path d="M2 6q5-5 10 0t10 0M2 12q5-5 10 0t10 0M2 18q5-5 10 0t10 0"/>',quality:'<path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6zM7 12l3 3 7-7"/>',box:'<path d="m12 2 10 5v10l-10 5-10-5V7zM2 7l10 5 10-5M12 12v10M7 5l10 5"/>',orbit:'<circle cx="12" cy="12" r="4"/><ellipse cx="12" cy="12" rx="11" ry="6" transform="rotate(-35 12 12)"/>'};
 const icon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">${icons[k]||icons.network}</svg>`;
 const externalCard=x=>`<div class="map-company"><span>${esc(x.name)}</span><p>${esc(x.detail)}</p>${/^https:\/\//.test(x.url||'')?`<a href="${esc(x.url)}" target="_blank" rel="noopener">公式資料</a>`:''}</div>`;
 const upstream=(m.leaders||[]).length?`<section class="map-upstream"><small>海外の需要起点・技術提供企業</small><div class="map-leaders">${m.leaders.map(externalCard).join('')}</div><p class="map-legend">ここから日本企業への線は需要の仮説。直接受注が確認できた関係だけ本文に明記します。</p></section><div class="map-down" aria-hidden="true">↓</div>`:'';
 app.innerHTML+=`<div class="map-picker" role="group" aria-label="需要マップのテーマ">${list.map(x=>`<button class="action" data-map="${esc(x.id)}" aria-pressed="${x.id===m.id}">${esc(x.title)}</button>`).join('')}</div><p class="muted">${esc(m.intro)}</p><p class="map-legend">実線枠：確認した事業・需要　／　破線枠：今後の利益仮説<br>矢印は需要の流れです。企業間の直接取引を示しません。</p>${upstream}<section class="demand-diagram" aria-label="${esc(m.title)}の需要の流れ"><div class="map-driver">${icon(m.icon)}<small>川上の変化</small><h2>${esc(m.driver)}</h2></div><div class="map-down" aria-hidden="true">↓</div><div class="map-branches">${m.branches.map((b,i)=>`<article class="map-branch"><div class="map-stage"><span class="map-step">${i+1}</span><small>必要になる工程</small><h3>${esc(b.title)}</h3></div><div class="map-down" aria-hidden="true">↓</div><div class="map-companies"><small>関連する企業・調査候補</small>${b.codes.map(c=>notes[c]?`<button class="map-company" data-company="${esc(c)}"><span>${esc(notes[c].name)}</span><small>${esc(c)} · 本文を読む</small>${score(c)}</button>`:'').join('')||((b.candidates||[]).length?'':'<p>企業を調査中</p>')}${(b.candidates||[]).map(externalCard).join('')}${b.evidence?`<p class="map-legend">${esc(b.evidence)}</p>`:''}</div><div class="map-down" aria-hidden="true">↓</div><div class="map-outcome"><small>利益につながる仮説</small><p>${esc(b.result)}</p></div><details class="map-risk"><summary>止まる条件・未確認</summary><p>${esc(b.risk)}</p></details></article>`).join('')}</div></section><p class="muted">${(m.sources||[]).filter(u=>/^https:\/\//.test(u)).map((u,i)=>`<a class="source" href="${esc(u)}" target="_blank" rel="noopener">根拠資料 ${i+1}</a>`).join('')}研究 ${esc(D.demandMaps.updated)} · 点数は3か月／12か月の主観評価。需要の強さだけで割安とは判断しません。</p>`;
 app.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{demandMapId=b.dataset.map;route();});
}

function newsItems(){return (D.news?.entries||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)||a.id.localeCompare(b.id));}
function newsDay(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function recentNews(items,day){const end=Date.parse(day+'T00:00:00Z');return items.filter(n=>{const age=end-Date.parse(n.date+'T00:00:00Z');return age>=0&&age<7*86400000;});}
function newsRows(items){let date='';return items.map(n=>{const heading=date!==n.date?`<div class="news-date">${esc(n.date.replaceAll('-','.'))}</div>`:'';date=n.date;return heading+`<details class="news-story"><summary><span class="news-category">${esc(n.category)}</span><span class="news-headline">${esc(n.headline)}</span><span class="news-expand" aria-hidden="true">＋</span></summary><div class="news-body"><p class="news-lead">${esc(n.summary)}</p><h3>今日、確認すること</h3><ul>${n.actions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>判断の根拠</h3>${n.body.map(x=>`<p>${esc(x)}</p>`).join('')}<div class="news-caution"><small>未確認・注意点</small><p>${esc(n.caution)}</p></div><div class="news-links">${n.codes.filter(c=>notes[c]).map(c=>`<a class="action" href="#company/${esc(c)}">${esc(notes[c].name)} · ${esc(c)}</a>`).join('')}${n.sources.filter(s=>/^https:\/\//.test(s.url)).map(s=>`<a class="source" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join('')}</div><small class="muted">研究 ${esc(n.date)} · ${esc(n.asOf)}</small></div></details>`;}).join('');}
function today(){const items=newsItems(),recent=recentNews(items,newsDay());app.innerHTML=`<section class="news-masthead"><div><div class="eyebrow">YOUR DAILY INVESTMENT BRIEF</div><h1>News<span class="news-dot">.</span></h1></div><a class="news-archive-link" href="#notebook/news">Archive ↗</a></section><p class="news-intro">今日の確認を、ここから。</p><div class="news-list">${newsRows(recent)||'<p class="empty">直近7日分のNewsはまだありません。同期を確認するか、Archiveから過去分を読めます。</p>'}</div><div class="news-footer"><span>直近7日分 · タップして詳しく</span><a href="#notebook/news">過去のNewsを読む</a></div><h2 class="heading-updates">四季報</h2><div class="news-library"><p>${D.coverage.body_notes}社の研究ノート</p><a class="action" href="#notebook">会社を探す</a></div>`;}
function newsArchive(){app.innerHTML=title('NEWS ARCHIVE','News','過去の見立てと確認事項を、日付順に。')+`<div class="toolbar"><input id="news-search" type="search" aria-label="Newsを検索" placeholder="見出し・会社・コードを検索" value="${esc(newsQuery)}"></div><div id="news-results" class="news-list"></div>`;const draw=()=>{const q=newsQuery.trim().toLocaleLowerCase(),items=newsItems().filter(n=>[n.date,n.headline,n.summary,...n.codes,...n.codes.map(c=>notes[c]?.name||'')].join(' ').toLocaleLowerCase().includes(q));document.getElementById('news-results').innerHTML=newsRows(items)||'<p class="empty">該当するNewsはありません。</p>';};draw();document.getElementById('news-search').oninput=e=>{newsQuery=e.target.value;draw();};}

function notebook(){app.innerHTML=title('COMPANIES','自分用四季報','会社の理解、今の見立て、次に確かめること。')+`<small>${D.coverage.body_notes}社の本文を収録 · 残る${D.coverage.legacy_references}社は既存記録への入口段階</small><div class="toolbar"><input id="search" type="search" aria-label="会社・コード・テーマを検索" placeholder="会社・コード・テーマを検索" value="${esc(query)}"><select id="sort" aria-label="表示順"><option value="updated">研究更新順</option><option value="short">3か月の点数順</option><option value="long">12か月の点数順</option></select></div><div class="toolbar"><button class="action" id="watch-filter" aria-pressed="${onlyWatch}">${onlyWatch?'監視のみ表示中':'監視のみ表示'}</button></div><p class="muted" style="font-size:12px">点数は${esc(R.assessment_date)}時点の主観評価。確率ではありません。</p><div id="results" class="grid"></div>`;document.getElementById('sort').value=sort;renderResults();document.getElementById('search').addEventListener('input',e=>{query=e.target.value;renderResults()});document.getElementById('sort').addEventListener('change',e=>{sort=e.target.value;renderResults()});document.getElementById('watch-filter').onclick=()=>{onlyWatch=!onlyWatch;route()};}

function discoveryMatches(c,n,q,t){const text=[c,n.name,...n.themes.map(themeLabel)].join(' ').normalize('NFKC').toLocaleLowerCase();return (!t||n.themes.includes(t))&&text.includes(q.trim().normalize('NFKC').toLocaleLowerCase().replace(/めっき/g,'メッキ'));}

function discover(){app.innerHTML=title('DISCOVERY','次の変化を探す','テーマから会社へ。気になる会社から、別のテーマへ。')+`<div class="toolbar discovery-search"><input id="discovery-search" type="search" aria-label="会社・コード・テーマを検索" placeholder="会社・コード・テーマを検索" value="${esc(discoveryQuery)}"><span id="discovery-count" class="muted" aria-live="polite"></span></div><details class="theme-filter"><summary>テーマを選ぶ<span class="theme-current">${esc(themeLabel(theme)||'すべて')}</span></summary><div class="chips" aria-label="テーマ">${['',...themes].map(t=>`<button data-theme="${esc(t)}" aria-pressed="${t===theme}">${esc(themeLabel(t)||'すべて')}</button>`).join('')}</div></details><div id="discovery-results" class="grid"></div>`;renderDiscoveryResults();document.getElementById('discovery-search').oninput=e=>{discoveryQuery=e.target.value;renderDiscoveryResults();};}

function review(){app.innerHTML=title('REVIEW','判断を、振り返る。','良かった予測も、外れた予測も、同じ基準で残す。')+`<section class="card"><div class="eyebrow">固定した初回評価</div><h2 style="margin-top:6px">${esc(R.assessment_date)} · ${R.rows.length}社</h2><p>基準株価 ${esc(R.price_date)}終値</p><p>3か月：${esc(R.horizons['3m'].target_date)}<br>12か月：${esc(R.horizons['12m'].target_date)}</p><small>日曜の評価に直前終値を使った観測記録です。その価格で購入できた実績ではありません。</small></section><h2>点数と結果</h2><div class="card table-wrap"><table><thead><tr><th>会社</th><th>3か月</th><th>12か月</th><th>結果</th></tr></thead><tbody>${R.rows.map(r=>`<tr><td><button class="open" data-company="${r.code}">${esc(r.name)}</button></td><td>${r.short_3m}/10</td><td>${r.long_12m}/10</td><td>${r.results?.['3m']?.status==='not_due'?'評価待ち':'未集計'}</td></tr>`).join('')}</tbody></table></div><p class="muted">結果の自動取得は未接続。未評価を0%や成功として表示しません。</p><details><summary>評価のルール</summary>${R.evaluation_rules.map(t=>`<p>${esc(t)}</p>`).join('')}</details><h2>既存の運用・検証</h2><div class="tools">${legacy('hold','運用成績','既存の記録')}${legacy('compare','戦略比較','手法を比較')}${legacy('status','検証','検証状況')}${legacy('rec','記録','過去の記録')}${legacy('ideal','理想配分','配分を確認')}</div>`;}
function company(c){const n=notes[c],r=ratings[c];if(!n){app.innerHTML='<h1>この会社の本文はまだありません</h1><a href="#notebook">四季報へ戻る</a>';return;}app.innerHTML=`<a class="action" href="#${priorView}">← 一覧へ戻る</a><div style="margin-top:24px">${title(esc(c)+' / '+esc(n.stage),esc(n.name),esc(n.summary))}</div><button id="watch-toggle" class="action primary" aria-pressed="${watch.has(c)}">${watch.has(c)?'監視から外す':'監視に追加'}</button><p><small>研究更新 ${esc(n.updated)} · 対象資料 ${esc(n.source_period)}</small></p>${r?`<section class="card"><div class="row"><b>今の価格からの投資妙味</b><small>10点満点</small></div><div class="rating-pair"><div><span>短期・3か月</span><b>${r.short_3m}</b> / 10</div><div><span>中長期・12か月</span><b>${r.long_12m}</b> / 10</div></div><small>採点 ${esc(R.assessment_date)} · 株価 ${Number(r.baseline_close).toLocaleString('ja-JP')}円（${esc(r.baseline_price_date)}）<br>根拠の確かさ：${esc(r.evidence_confidence)} · 主観評価</small><p><b>3か月：</b>${esc(r.short_reason)}</p><p><b>12か月：</b>${esc(r.long_reason)}</p></section>`:''}<h2 class="heading-next">次に確かめること</h2><section class="card"><p>${esc(n.next)}</p></section><h2 class="heading-caution">見立てが変わる条件</h2><section class="card"><p>${esc(r?.change_conditions||n.counter)}</p></section><h2>会社を読む</h2>${[['business','何で稼ぐ会社か'],['facts','決算で確認した事実'],['hypothesis','利益につながる仮説'],['counter','反証・不確かな点'],['valuation','価格評価の根拠'],['change','前回から変えたこと']].map(([k,label])=>`<details class="research-section" data-section="${k}" ${k==='business'?'open':''}><summary>${label}</summary><p class="detail-body">${esc(n[k])}</p></details>`).join('')}<details><summary>出典を確認する</summary>${n.sources.map(s=>{const safe=/^https:\/\//.test(s);return safe?`<a class="source" href="${esc(s.startsWith('https://')?s:'../../'+s)}" target="_blank" rel="noopener">${esc(s)}</a>`:`<p>${esc(s)}</p>`}).join('')}</details><h2>つながる会社</h2><div class="grid">${(n.related||[]).map(code=>notes[code]?card(code,notes[code]):`<div class="card"><small>${esc(code)}</small><p>本文未収録</p></div>`).join('')}</div>`;document.getElementById('watch-toggle').onclick=()=>{const next=new Set(watch);next.has(c)?next.delete(c):next.add(c);try{localStorage.setItem(KEY,JSON.stringify([...next]));watch=next;status.textContent='監視リストをこのブラウザーに保存しました。他端末との同期はありません。';route()}catch{status.textContent='保存できませんでした。監視リストは変更していません。'}};}
function route(){const h=location.hash.slice(1)||'today';const detail=h.startsWith('company/');let view=detail?'notebook':h;if(!['today','discover','notebook','review'].includes(view))view='today';document.querySelectorAll('nav a').forEach(a=>{if(a.dataset.view===view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(detail)company(h.split('/')[1]);else{priorView=view;({today,discover,notebook,review}[view])()}window.scrollTo(0,0);}

 frameHost.hidden=false;
 for(const [k,f] of Object.entries(frames))f.hidden=k!==kind;
 if(!frames[kind]){const f=document.createElement('iframe');f.title=kind==='inv'?'Invnoteの既存機能':'Screenerの既存機能';f.style.cssText='display:block;width:100%;height:78vh;min-height:540px;border:1px solid #dce2db;border-radius:14px;background:white';
 f.style.visibility='hidden';f.src=(kind==='inv'?'invnote-app.html?workspace=1&v=8c16f3e27341':'screener/index.html?workspace=1&v=8c16f3e27341')+'#'+tab;frames[kind]=f;frameHost.append(f);
 }else{frames[kind].hidden=false;frames[kind].style.display='block';frames[kind].contentWindow.location.hash=tab;}
 for(const [k,f] of Object.entries(frames))if(k!==kind)f.style.display='none';
}
const originalRoute=route;
route=function(){
 frameHost.hidden=true;
 const hash=location.hash.slice(1)||'today', [root,sub]=hash.split('/');
 if(root==='company'){originalRoute();companyTools(sub,hash.split('/')[2]);return;}
 const area=sections[root]?root:'today', list=sections[area], selected=list.find(x=>x[0]===sub)||list[0];
 document.querySelectorAll('nav a').forEach(a=>{if(a.dataset.view===area)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});priorView=area;
 if(selected[0].includes(':')){

 app.style.paddingBottom='12px';
 const [kind,tab]=selected[0].split(':');embedded(kind,tab);
 }else{app.style.paddingBottom='120px';(selected[0]==='map'?demandMap:selected[0]==='news'?newsArchive:({today,discover,notebook,review}[area]))();}
 const bar=document.createElement('div');bar.className='chips workspace-tabs';bar.dataset.area=area;bar.setAttribute('aria-label',areaNames[area]+'の機能');
 bar.innerHTML=list.map(([id,label])=>`<a class="action" href="#${area}/${id}" ${id===selected[0]?'aria-current="page"':''}>${esc(label)}</a>`).join('');app.prepend(bar);
 window.scrollTo(0,0);
};
