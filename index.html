'use strict';
let D=JSON.parse(document.getElementById('data').textContent), notes=D.notes, R=D.ratings, ratings=Object.fromEntries(R.rows.map(x=>[x.code,x]));
const app=document.getElementById('app'), status=document.getElementById('status'), KEY='private-investment-preview-watch-v1';
let watch=new Set(), query='', discoveryQuery='', newsQuery='', theme='', sort='code', sortDirection=1, onlyWatch=false, priorView='notebook';
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))watch=new Set(saved.filter(c=>Object.hasOwn(notes,c)));}catch{status.textContent='監視リストを読み込めませんでした。この画面内で選択できます。';}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let all=Object.entries(notes), themes=[...new Set(all.flatMap(([,n])=>n.themes))].sort((a,b)=>a.localeCompare(b,'ja'));
const themeLabel=t=>String(t).replace(/めっき/g,'メッキ');
const score=c=>ratings[c]?`<div class="score">3か月 <b>${ratings[c].short_3m}</b> / 12か月 <b>${ratings[c].long_12m}</b></div>`:'<small>未採点</small>';
const title=(eye,h,p)=>`<div class="section-top"><div class="eyebrow">${eye}</div><h1>${h}</h1><p class="muted">${p}</p></div>`;
function earningsDates(n){
 const d=n.earnings_dates||{},latest=d.latest||{},next=d.next||{};
 const date=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)?x.replaceAll('-','/') : null;
 const latestText=date(latest.date)||'未確認';
 const nextText=date(next.date)|| (next.status==='unannounced'?'未公表':'未確認');
 return `<div class="earnings-dates" style="display:flex;flex-wrap:wrap;gap:8px 24px;margin:10px 0;font-size:13px"><span>最新決算日 <strong>${esc(latestText)}</strong>${latest.period?'（'+esc(latest.period)+'）':''}</span><span>次回決算予定日 <strong>${esc(nextText)}</strong></span></div>`;
}
const card=(c,n,change=false)=>`<article class="card company-card"><small>${esc(c)} · 研究 ${esc(n.updated)}</small><div><button class="open" data-company="${c}">${esc(n.name)}</button></div>${earningsDates(n)}${depthBadge(c)}${score(c)}<p>${esc(change?n.change:n.summary)}</p><div>${n.themes.slice(0,3).map(t=>`<span class="pill">${esc(themeLabel(t))}</span>`).join('')}</div></article>`;
let demandMapId='ai';
function demandMap(){
 priorView='discover/map';
 const list=Array.isArray(D.demandMaps?.maps)?D.demandMaps.maps:[];
 app.innerHTML=title('DEMAND MAP','需要のつながり','川上の変化から、工程・企業・利益へ。');
 if(!list.length){app.innerHTML+='<p class="empty">需要マップを読み込むには、右上の同期を押してください。</p>';return;}
 const m=list.find(x=>x.id===demandMapId)||list[0];
 const icons={network:'<circle cx="12" cy="5" r="3"/><circle cx="5" cy="19" r="3"/><circle cx="19" cy="19" r="3"/><path d="M10 8 6 16m8-8 4 8M8 19h8"/>',waves:'<path d="M2 6q5-5 10 0t10 0M2 12q5-5 10 0t10 0M2 18q5-5 10 0t10 0"/>',quality:'<path d="m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6zM7 12l3 3 7-7"/>',box:'<path d="m12 2 10 5v10l-10 5-10-5V7zM2 7l10 5 10-5M12 12v10M7 5l10 5"/>',orbit:'<circle cx="12" cy="12" r="4"/><ellipse cx="12" cy="12" rx="11" ry="6" transform="rotate(-35 12 12)"/>'};
 const icon=k=>`<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5">${icons[k]||icons.network}</svg>`;
 const externalCard=x=>`<div class="map-company"><span>${esc(x.name)}</span><p>${esc(x.detail)}</p>${/^https:\/\//.test(x.url||'')?`<a href="${esc(x.url)}" target="_blank" rel="noopener">公式資料</a>`:''}</div>`;
 const upstream=(m.leaders||[]).length?`<section class="map-upstream"><small>海外の需要起点・技術提供企業</small><div class="map-leaders">${m.leaders.map(externalCard).join('')}</div><p class="map-legend">ここから日本企業への線は需要の仮説。直接受注が確認できた関係だけ本文に明記します。</p></section><div class="map-down" aria-hidden="true">↓</div>`:'';
 app.innerHTML+=`<div class="map-picker" role="group" aria-label="需要マップのテーマ">${list.map(x=>`<button class="action" data-map="${esc(x.id)}" aria-pressed="${x.id===m.id}">${esc(x.title)}</button>`).join('')}</div><p class="muted">${esc(m.intro)}</p><p class="map-legend">実線枠：確認した事業・需要　／　破線枠：今後の利益仮説<br>矢印は需要の流れです。企業間の直接取引を示しません。</p>${upstream}<section class="demand-diagram" aria-label="${esc(m.title)}の需要の流れ"><div class="map-driver">${icon(m.icon)}<small>川上の変化</small><h2>${esc(m.driver)}</h2></div><div class="map-down" aria-hidden="true">↓</div><div class="map-branches">${m.branches.map((b,i)=>`<article class="map-branch"><div class="map-stage"><span class="map-step">${i+1}</span><small>必要になる工程</small><h3>${esc(b.title)}</h3></div><div class="map-down" aria-hidden="true">↓</div><div class="map-companies"><small>関連する企業・調査候補</small>${b.codes.map(c=>notes[c]?`<button class="map-company" data-company="${esc(c)}"><span>${esc(notes[c].name)}</span><small>${esc(c)} · 本文を読む</small>${score(c)}</button>`:'').join('')||((b.candidates||[]).length?'':'<p>企業を調査中</p>')}${(b.candidates||[]).map(externalCard).join('')}${b.evidence?`<p class="map-legend">${esc(b.evidence)}</p>`:''}</div><div class="map-down" aria-hidden="true">↓</div><div class="map-outcome"><small>利益につながる仮説</small><p>${esc(b.result)}</p></div><details class="map-risk"><summary>止まる条件・未確認</summary><p>${esc(b.risk)}</p></details></article>`).join('')}</div></section><p class="muted">${(m.sources||[]).filter(u=>/^https:\/\//.test(u)).map((u,i)=>`<a class="source" href="${esc(u)}" target="_blank" rel="noopener">根拠資料 ${i+1}</a>`).join('')}研究 ${esc(D.demandMaps.updated)} · 点数は3か月／12か月の主観評価。需要の強さだけで割安とは判断しません。</p>`;
 app.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{demandMapId=b.dataset.map;route();});
}

function newsItems(){return (D.news?.entries||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)||a.id.localeCompare(b.id));}
function researchDepth(c){return D.researchProgress?.companies?.[c]||null;}
function depthStars(p){if(!p||!Number.isInteger(p.stars)||p.stars<1||p.stars>5)return '未判定';return `<span class="depth-stars" role="img" aria-label="${p.stars} / 5">${Array.from({length:5},(_,i)=>`<svg viewBox="0 0 24 24" aria-hidden="true" class="${i<p.stars?'depth-star-filled':'depth-star-empty'}"><path d="m12 3 2.8 5.7 6.3.9-4.55 4.44 1.07 6.26L12 17.34l-5.62 2.96 1.07-6.26L2.9 9.6l6.3-.9Z"/></svg>`).join('')}</span>`;}
function depthBadge(c){const p=researchDepth(c);return `<p class="research-depth-badge" aria-label="調査充実度 ${p?.stars||'未判定'} / 5">調査充実度 <b>${depthStars(p)}</b> <small>${esc(p?.needs_reassessment?'再評価待ち（前回評価）':p?.label||'記録の評価待ち')}</small></p>`;}
function depthText(v){return typeof v==='string'?v:JSON.stringify(v,null,2);}
function researchProgressPanel(c){
 const p=researchDepth(c);if(!p)return '<section class="card"><h2>調査充実度：未判定</h2><p>調査記録を整理してから評価します。未読という意味ではありません。</p></section>';
 const state={text_read:'本文通読の記録あり',partial:'部分確認',not_obtained:'未取得',not_public:'非公開',unknown:'読解範囲が未記録'};
 const docs=p.documents||[],records=p.records||[];
 const linked=u=>typeof u==='string'&&/^https:\/\//.test(u)?`<a class="source" href="${esc(u)}" target="_blank" rel="noopener">原資料を開く ↗</a>`:'';
 const reading=records.flatMap(r=>(r.coverage||[]).filter(x=>/reading|coverage|scope|materialsRead|documentsRead/.test(x.field)).map(x=>({record:r,...x})));
 return `<section class="card research-progress" aria-label="調査の進み具合"><h2>調査充実度 ${depthStars(p)}</h2><b>${esc(p.needs_reassessment?'再評価待ち（前回：'+p.label+'）':p.label)}</b><p>${esc(p.reason)}</p><small>調査充実度評価 ${esc(p.assessed_on)} · 研究本文 ${esc(p.research_as_of)} · 価格基準 ${esc(p.price_as_of||'個社本文参照')}</small><p class="muted">投資妙味の点数とは別です。★5は、その時点の判断に必要な調査が完了した状態。新しい決算や条件の変化は引き続き確認します。</p>${p.needs_reassessment?'<p class="depth-warning">評価後に本文が更新されています。現在の調査充実度は再評価が必要です。</p>':''}<h3>残る調査</h3>${p.blocking_work.length?`<ul>${p.blocking_work.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p>現時点の重要な未完作業なし。次の開示・条件変化を監視します。</p>'}<h3>次にすること</h3><p>${esc(p.next_action)}</p><details><summary>何を読んだか・どこまで確認したか</summary><p><b>対象資料：</b>${esc(p.scope)}</p><p class="muted">${esc(p.record_basis)}</p><h3>確認した内容</h3><p class="detail-body">${esc((p.completed_work||" ").split("\n")[0].slice(0,500))}</p><details><summary>確認した内容をすべて読む</summary><p class="detail-body">${esc(p.completed_work)}</p></details>${reading.map(x=>`<details><summary>${esc(x.record.date||'日付は記録参照')} · 読解範囲</summary><small>${esc(x.scope)} · 記録元 ${esc(x.record.path)}</small><pre class="depth-record">${esc(depthText(x.value))}</pre></details>`).join('')}<h3>資料別の読解記録・参照一覧</h3><p class="muted">参照一覧にあるだけの資料を通読済みには数えません。通読・部分確認の記録があるものは下に範囲を表示します。</p>${docs.map(d=>`<details><summary>${esc(state[d.status]||'未判定')} · ${esc(d.title||d.source||d.id)}</summary><p>${esc(d.scope||'範囲未記録')}</p><small>読解日 ${esc(d.reviewed_on||'未記録')} · 図表 ${esc(d.visual_review||'未記録')}</small>${linked(d.url||d.source)}${d.evidence?`<p class="muted">記録元：${esc(d.evidence.join(' / '))}</p>`:''}</details>`).join('')}</details><details><summary>未確認事項・見立てが変わる条件</summary><p class="detail-body">${esc(p.unconfirmed)}</p><h3>今後の監視事項</h3><p>${esc(p.monitoring_triggers)}</p></details><details><summary>過去の調査記録 ${records.length}件</summary><p class="muted">関連言及には比較先としての登場も含みます。件数は読了数ではありません。</p>${records.map(r=>`<details><summary>${esc(r.date||'日付未記録')} · ${esc(r.path.replace('research/method-lab/',''))}</summary><small>${esc(r.association)}</small>${r.excerpt?`<p>${esc(r.excerpt_scope)}</p><pre class="depth-record">${esc(r.excerpt)}</pre>`:""}${(r.coverage||[]).map(x=>`<p>${esc(x.scope)} · ${esc(x.field)}</p><pre class="depth-record">${esc(depthText(x.value))}</pre>`).join('')||'<p>資料別の読解範囲はこの記録に明記されていません。</p>'}</details>`).join('')}</details></section>`;
}
function depthOverview(){const ps=Object.values(D.researchProgress?.companies||{});return ps.length?`<p class="depth-overview">調査充実度を整理：${ps.length}社 · ${[5,4,3,2,1].map(s=>'★'+s+' '+ps.filter(p=>p.stars===s&&!p.needs_reassessment).length+'社').join(' / ')} · 未判定/再評価 ${ps.filter(p=>!p.stars||p.needs_reassessment).length}社</p>`:'';}
function companyFacts(code){
 const p=D.companyProfiles?.[code]||{},cap=p.marketCap;
 const amount=cap&&Number.isFinite(cap.oku)&&cap.oku>0?(cap.oku>=10000?(cap.oku/10000).toLocaleString('ja-JP',{maximumFractionDigits:2})+'兆円':cap.oku.toLocaleString('ja-JP',{maximumFractionDigits:1})+'億円'):'未確認';
 const indices=[['nikkei225','日経225'],['topix','TOPIX'],['growth250','グロース250']];
 const status=v=>v===true?'採用':v===false?'非採用':'未確認';
 const link=(url,label)=>typeof url==='string'&&/^https:\/\//.test(url)?`<a class="source" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)} ↗</a>`:'';
 return `<div class="company-facts"><div class="company-facts-main"><span>時価総額 <strong>${esc(amount)}</strong>${cap?`<small>${esc(cap.asOf)} 時点</small>`:''}</span><span>上場市場 <strong>${esc(p.market||'未確認')}</strong>${p.marketAsOf?`<small>${esc(p.marketAsOf)} 時点</small>`:''}</span></div><div class="company-index-tags">${indices.map(([k,label])=>`<span>${label}：${status(p.indices?.[k]?.member)}</span>`).join('')}</div><details><summary>基準日・出典</summary>${cap?`<p>${esc(cap.basis)}。${link(cap.source,'時価総額の出典')}</p>`:'<p>時価総額データは未確認です。</p>'}${link(p.marketSource,'市場区分の出典')}${indices.map(([k,label])=>{const x=p.indices?.[k];return `<p>${label}：${status(x?.member)}${x?.asOf?'（'+esc(x.asOf)+' 時点）':''} ${link(x?.source,'出典')}</p>`;}).join('')}<p>グロース市場は上場先、グロース250は指数です。採用状況と投資評価は別です。</p></details></div>`;
}
function companyIntro(code){
 const n=notes[code];if(!n)return '';
 // Public business descriptions only; research conclusions remain in the authenticated notes.
 const basics={
  '6407':{business:'工場の自動化を支える部品や機械を作る会社です。空気の力で動く部品、液体やガスの流れを調整する部品、薬を包装する機械などを扱います。',earnings:'工場や装置メーカーに、こうした部品・機械を販売して収入を得ます。製品の販売額から材料費や製造費などを差し引いた分が利益になります。',sources:['https://www.ckd.co.jp/productinfo/taikei/','https://www.ckd.co.jp/auto/']},
  '4887':{business:'沢井製薬などを傘下に持つ医薬品グループです。主に、先発医薬品の特許が切れた後に販売される「ジェネリック医薬品」を作っています。',earnings:'薬を製造・販売して収入を得ます。販売する数量だけでなく、薬の販売価格、原料費、工場での製造費が利益を左右します。',sources:['https://www.sawaigroup.holdings/about/group/','https://www.sawai.co.jp/medicine/']}
 };
 const p=n.introduction||basics[code];
 if(!p)return `<section class="company-intro"><small>${esc(n.name)}は、どんな会社？</small><p>${esc(n.business||'事業内容を確認中です。')}</p>${companyFacts(code)}</section>`;
 return `<section class="company-intro"><small>${esc(n.name)}は、どんな会社？</small><p>${esc(p.business)}</p><small>どう収益を得る？</small><p>${esc(p.earnings)}</p>${companyFacts(code)}${(p.sources||[]).filter(s=>/^https:\/\//.test(s)).map(s=>`<a class="source" href="${esc(s)}" target="_blank" rel="noopener">会社の事業紹介 ↗</a>`).join('')}</section>`;
}
function newsDay(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function recentNews(items,day){const end=Date.parse(day+'T00:00:00Z');return items.filter(n=>{const age=end-Date.parse(n.date+'T00:00:00Z');return age>=0&&age<7*86400000;});}
function newsKind(n){
 const category=n.category||'',text=category+' '+(n.headline||'');
 if(/PORTFOLIO/i.test(category))return {kind:'portfolio',label:'Portfolio Check'};
 if(/MARKET|MACRO|市場|相場/i.test(category))return {kind:'market',label:'Market Watch'};
 const detail=/再採点|再評価|見直し/.test(text)?'再評価':/深掘|深堀|精査/.test(category)?'深掘り':/新規発掘|探索|DISCLOSURE WATCH/i.test(category)?'探索':'個社調査';
 return {kind:'research',label:'Research / '+detail};
}
function newsRows(items){let date='';return items.map(n=>{const tag=newsKind(n);const heading=date!==n.date?`<div class="news-date">${esc(n.date.replaceAll('-','.'))}</div>`:'';date=n.date;return heading+`<details class="news-story" data-news-kind="${tag.kind}"><summary><span class="news-category">${esc(tag.label)}</span><span class="news-headline">${esc(n.headline)}</span><span class="news-expand" aria-hidden="true">＋</span></summary><div class="news-body">${n.codes.map(companyIntro).join('')}<p class="news-lead">${esc(n.summary)}</p><h3>今日、確認すること</h3><ul>${n.actions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>判断の根拠</h3>${n.body.map(x=>`<p>${esc(x)}</p>`).join('')}<div class="news-caution"><small>未確認・注意点</small><p>${esc(n.caution)}</p></div><div class="news-links">${n.codes.filter(c=>notes[c]).map(c=>`<a class="action" href="#company/${esc(c)}">${esc(notes[c].name)} · ${esc(c)}</a>`).join('')}${n.sources.filter(s=>/^https:\/\//.test(s.url)).map(s=>`<a class="source" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join('')}</div><small class="muted">研究 ${esc(n.date)} · ${esc(n.asOf)}</small></div></details>`;}).join('');}
function marketPage(){app.innerHTML=title('MARKET','Market','市場環境とカレンダー')+'<div id="news-macro"><p class="muted">市場環境を確認中…</p></div><h2>カレンダー</h2>';app.style.paddingBottom='12px';embedded('inv','vCal');}

rmalizeCompanyQuery(c)===q||normalizeCompanyQuery(n.name)===q);const rows=filteredCompanies();const hit=exact.length===1?exact[0]:rows.length===1?rows[0]:null;if(q&&hit){e.preventDefault();location.hash='company/'+hit[0];}});document.getElementById('sort').addEventListener('change',e=>{sort=e.target.value;sortDirection=1;renderResults()});document.querySelectorAll('.company-sort').forEach(button=>button.onclick=()=>{sortDirection=sort===button.dataset.sort?-sortDirection:1;sort=button.dataset.sort;document.getElementById('sort').value=sort;renderResults()});document.getElementById('watch-filter').onclick=()=>{onlyWatch=!onlyWatch;route()};}
function normalizeCompanyQuery(value){return String(value).normalize('NFKC').toLocaleLowerCase().trim();}
function compareCompanies(a,b){
 const codeOrder=a[0].localeCompare(b[0],'en');
 if(sort==='code')return sortDirection*codeOrder;
 if(sort==='name')return sortDirection*a[1].name.localeCompare(b[1].name,'ja')||codeOrder;
 if(sort==='updated')return sortDirection*(b[1].updated||'').localeCompare(a[1].updated||'')||codeOrder;
 const value=row=>sort==='depth'?researchDepth(row[0])?.stars:ratings[row[0]]?.[sort==='short'?'short_3m':'long_12m'];
 const av=value(a),bv=value(b),am=typeof av!=='number'||!Number.isFinite(av),bm=typeof bv!=='number'||!Number.isFinite(bv);
 if(am||bm)return am===bm?codeOrder:am?1:-1;
 return sortDirection*(bv-av)||codeOrder;
}

function ninePointPriceLine(code){
 let p=notes[code]?.ninePointPrice;
 // Compatibility with authenticated notes saved before the structured field existed.
 if(!p){
  const v=notes[code]?.valuation||'';
  const a=v.match(/9点検討の目安[：】]\s*([\d,]+)〜([\d,]+)円/);
  const b=v.match(/根拠確認後に9点を再評価する価格条件：([\d,]+)〜([\d,]+)円/);
  const m=a||b;
  if(m)p={classification:a?'A':'B',low:Number(m[1].replaceAll(',','')),high:Number(m[2].replaceAll(',',''))};
  else if(v.includes('9点価格：保留・未算定'))p={classification:'C'};
 }
 const hasPriceData=Object.values(notes).some(n=>n.ninePointPrice);
 if(!p&&!hasPriceData)return '<p class="nine-point-price"><b>12か月9点の目安：価格データ未同期</b><br><small>同期完了後に表示します。更新されない場合は上部の同期ボタンを押してください。</small></p>';
 const valid=p&&Number.isFinite(p.low)&&Number.isFinite(p.high)&&p.low>0&&p.high>=p.low;
 const band=valid?Number(p.low).toLocaleString('ja-JP')+'〜'+Number(p.high).toLocaleString('ja-JP')+'円':'';
 let text='12か月9点の目安：保留・未算定';
 if(valid&&p.classification==='A')text='12か月9点の目安：'+band+'（業績見通し不変）';
 else if(valid&&p.classification==='B')text='12か月9点：未確定／根拠確認後の再評価価格 '+band;
 return '<p class="nine-point-price"><b>'+accentPrices(text)+'</b>'+(p?.asOf?'<br><small>見直し '+esc(p.asOf)+' · 価格到達で自動採点はしません</small>':'')+'</p>';
}
function company(c){const n=notes[c],r=ratings[c];if(!n){app.innerHTML='<h1>この会社の本文はまだありません</h1><a href="#notebook">四季報へ戻る</a>';return;}app.innerHTML=`<a class="action" href="#${priorView}">← 一覧へ戻る</a><div style="margin-top:24px">${title(esc(c)+' / '+esc(n.stage),esc(n.name),esc(n.summary))}${earningsDates(n)}</div><button id="watch-toggle" class="action primary" aria-pressed="${watch.has(c)}">${watch.has(c)?'監視から外す':'監視に追加'}</button><p><small>研究更新 ${esc(n.updated)} · 対象資料 ${esc(n.source_period)}</small></p>${companyIntro(c)}${researchProgressPanel(c)}${r?`<section class="card"><div class="row"><b>今の価格からの投資妙味</b><small>10点満点</small></div><div class="rating-pair"><div><span>短期・3か月</span><b>${r.short_3m}</b> / 10</div><div><span>中長期・12か月</span><b>${r.long_12m}</b> / 10</div></div><small>採点 ${esc(r.assessment_date||R.assessment_date)} · 株価 ${Number(r.baseline_close).toLocaleString('ja-JP')}円（${esc(r.baseline_price_date)}）<br>根拠の確かさ：${esc(r.evidence_confidence)} · 主観評価</small>${ninePointPriceLine(c)}<p><b>3か月：</b>${esc(r.short_reason)}</p><p><b>12か月：</b>${esc(r.long_reason)}</p></section>`:''}<h2 class="heading-next">次に確かめること</h2><section class="card"><p>${esc(n.next)}</p></section><h2 class="heading-caution">見立てが変わる条件</h2><section class="card"><p>${esc(r?.change_conditions||n.counter)}</p></section><h2>会社を読む</h2>${[['business','何で稼ぐ会社か'],['facts','決算で確認した事実'],['hypothesis','利益につながる仮説'],['counter','反証・不確かな点'],['valuation','価格評価の根拠'],['change','前回から変えたこと']].map(([k,label])=>`<details class="research-section" data-section="${k}" ${k==='business'?'open':''}><summary>${label}</summary><p class="detail-body">${esc(n[k])}</p></details>`).join('')}<details><summary>出典を確認する</summary>${n.sources.map(s=>{const safe=/^https:\/\//.test(s);return safe?`<a class="source" href="${esc(s.startsWith('https://')?s:'../../'+s)}" target="_blank" rel="noopener">${esc(s)}</a>`:`<p>${esc(s)}</p>`}).join('')}</details><h2>つながる会社</h2><div class="grid">${(n.related||[]).map(code=>notes[code]?card function accentPrices(text,kind='reference'){
 const safe=esc(text);
 return safe.replace(/[0-9０-９][0-9０-９,，]*(?:[.．][0-9０-９]+)?(?:\s*[〜～–—−-]\s*[0-9０-９][0-9０-９,，]*(?:[.．][0-9０-９]+)?)*円/g,price=>`<strong class="price-accent price-accent-${kind}">${price}</strong>`);
}
function priceSheetAmounts(text){
 return [...new Set(text.match(/[0-9０-９][0-9０-９,，]*(?:[.．][0-9０-９]+)?(?:\s*[〜～–—−-]\s*[0-9０-９][0-9０-９,，]*(?:[.．][0-9０-９]+)?)*円/g)||[])];
}
function priceSheetValue(line,kind){
 // Display only an explicit valuation result, never an EPS input or a historical price.
 if(kind==='technical')return priceSheetAmounts(line.replace(/[（(][^）)]*[）)]/g,'').split(/次の上値確認|その上は|上値の次|；次の確認/)[0]);
 let text=line.split(/；|;|旧9点|変更理由/)[0];
 const approx=text.lastIndexOf('概算');
 if(approx>=0)text=text.slice(approx+2);
 else{
  const label=kind==='fundamental'?/通常価値(?:は|約)?/:kind==='buy'?/(?:買い増し検討帯|減益耐性帯|検討帯)(?:は|約)?/:/(?:PER[^円。]*?倍|株価|評価額)/;
  const m=text.match(label);
  if(m)text=text.slice(m.index+m[0].length);
 }
 const values=priceSheetAmounts(text);
 const bands=values.filter(v=>/[〜～–—−-]/.test(v));
 return bands.length?[bands[0]]:values.length?[values[values.length-1]]:[];
}
function rankingPriceDetails(code){
 const n=notes[code],value=n?.valuation||'';
 // Quote only the current block; historical prices remain separately dated in the full record.
 const current=value.split('【以前の評価記録')[0];
 const lines=current.split(/\r?\n|(?<=。)/).map(x=>x.trim()).filter(Boolean);
 const excerpt=pattern=>lines.filter(x=>pattern.test(x)&&/[0-9０-９].*円/.test(x));
 const normal=excerpt(/通常価値/),buy=excerpt(/買い増し検討帯|減益耐性帯|減益耐性.*検討帯|検討帯.*減益耐性|軽い未達.*検討帯/);
 const technical=excerpt(/テクニカル/).filter(x=>!/(?:計測|見送り条件)/.test(x));
 const avoid=excerpt(/テクニカルの見送り条件/);
 const bear=excerpt(/弱気|悲観|深い減益|深い感応度/).filter(x=>/(?:倍|株価|評価額|価格)[^。\n]*[0-9０-９][0-9０-９,，.．〜～–—−\-]*円/.test(x));
 const field=(label,rows,missing,kind)=>{
  const amounts=[...new Set(rows.filter(x=>!/^変更理由|^旧/.test(x)).flatMap(x=>priceSheetValue(x,kind)))];
  return `<tr class="price-sheet-${kind}"><th scope="row">${label}</th><td><details class="price-cell"><summary>${amounts.length?amounts.map(x=>accentPrices(x,kind)).join(' / '):esc(missing)}</summary><div class="price-cell-details">${rows.length?[...new Set(rows)].map(x=>`<p>${accentPrices(x,kind)}</p>`).join(''):'<p>現行の価格評価本文に明示された価格はありません。</p>'}</div></details></td></tr>`;
 };
 const score=ninePointPriceLine(code),scoreAmounts=priceSheetAmounts(score.replace(/<[^>]*>/g,''));
 return `<section class="ranking-price-details" aria-label="価格の比較表"><h3>株価の比較表</h3><small>更新 ${esc(n?.updated||'未同期')} · 価格をタップすると詳細</small><div class="price-sheet-wrap"><table class="price-sheet"><thead><tr><th scope="col">算出方法</th><th scope="col">株価</th></tr></thead><tbody>${field('通常価値',normal,'未算定','fundamental')}${field('買い増し検討帯',buy,'未算定','buy')}${field('弱気ケース',bear,'未算定','bear')}${field('テクニカル<br>維持の確認',technical,'未確認','technical')}${field('テクニカル<br>見送り',avoid,'未確認','technical')}<tr class="price-sheet-score"><th scope="row">12か月9点の目安</th><td><details class="price-cell"><summary>${scoreAmounts.length?scoreAmounts.map(x=>accentPrices(x)).join(' / '):'未確定'}</summary><div class="price-cell-details">${score}</div></details></td></tr></tbody></table></div><details><summary>価格評価の根拠・条件・過去の記録を読む</summary><p class="detail-body">${esc(value||'価格評価は未同期・未記録です。')}</p></details></section>`;
}
